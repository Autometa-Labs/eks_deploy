# =============================================
# STAGING Environment Configuration for Ansible
# =============================================
env_name: "staging"
cluster_name: "staging-app-api-cl01"
aws_region: "us-east-1"

# Kubernetes namespaces
monitoring_namespace: "monitoring"
kube_system_namespace: "kube-system"

# Helm repositories
grafana_repo_name: "grafana"
grafana_repo_url: "https://grafana.github.io/helm-charts"
eks_repo_name: "eks"
eks_repo_url: "https://aws.github.io/eks-charts"
prometheus_repo_name: "prometheus-community"
prometheus_repo_url: "https://prometheus-community.github.io/helm-charts"

# Application versions
alb_controller_version: "v2.13.3"
ebs_csi_driver_version: "latest"
grafana_version: "latest"
prometheus_version: "latest"

# Storage configuration
storage_class: "gp3"
grafana_storage_size: "10Gi"
prometheus_storage_size: "50Gi"
alertmanager_storage_size: "10Gi"

# Grafana configuration
grafana_admin_password: "admin123"

# Prometheus configuration
prometheus_retention: "15d"
prometheus_retention_size: "45GB"

# DNS configuration
dns_zone_id: "Z02467093QT0UOKUO4CKO"
dns_domain: "collectalot.io"
grafana_dns_name: "grafana.{{ dns_domain }}"
prometheus_dns_name: "prometheus.{{ dns_domain }}"
alertmanager_dns_name: "alertmanager.{{ dns_domain }}"
