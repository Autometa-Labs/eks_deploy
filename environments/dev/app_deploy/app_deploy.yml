---
# =============================================
# Main Ansible Playbook for Application Deployment
# Deploys ALB Controller, EBS CSI Driver, and Grafana
# =============================================

- name: Deploy Kubernetes Applications to EKS Cluster
  hosts: localhost
  gather_facts: true
  connection: local
  
  vars_files:
    - env.yml
  
  roles:
    # Step 1: Discover AWS resources using cluster name
    - role: aws_discovery
      tags: ['discovery', 'always']
    
    # Step 2: Deploy AWS Load Balancer Controller
    - role: alb_controller
      tags: ['alb', 'controllers', 'all']
    
    # Step 3: Deploy EBS CSI Driver
    - role: ebs_csi_driver
      tags: ['ebs', 'storage', 'controllers', 'all']
    
    # Step 4: Deploy Prometheus monitoring stack
    - role: prometheus
      tags: ['prometheus', 'monitoring', 'all']
    
    # Step 5: Deploy Grafana with persistent storage
    - role: grafana
      tags: ['grafana', 'monitoring', 'all']

  post_tasks:
    - name: Display deployment summary
      debug:
        msg:
          - "=== Deployment Complete ==="
          - "Environment: {{ environment }}"
          - "Cluster: {{ cluster_name }}"
          - "Region: {{ aws_region }}"
          - ""
          - "Deployed Components:"
          - "✓ AWS Load Balancer Controller"
          - "✓ EBS CSI Driver with {{ storage_class }} storage class"
          - "✓ Prometheus Stack with {{ prometheus_storage_size }} persistent storage"
          - "✓ Grafana with {{ grafana_storage_size }} persistent storage"
          - ""
          - "Next Steps:"
          - "1. Check ALB provisioning: kubectl get ingress -n {{ monitoring_namespace }}"
          - "2. Access Prometheus and Grafana at their ALB URLs when ready"
          - "3. Login to Grafana with admin / {{ grafana_admin_password }}"
          - "4. Prometheus will be automatically configured as Grafana data source"
