---
# =============================================
# AWS Load Balancer Controller Deployment Role
# Uses discovered AWS resources from aws_discovery role
# =============================================

- name: Add EKS Helm repository
  kubernetes.core.helm_repository:
    name: "{{ eks_repo_name }}"
    repo_url: "{{ eks_repo_url }}"

- name: Update Helm repositories
  kubernetes.core.helm:
    name: dummy
    chart_ref: dummy
    release_namespace: dummy
    state: absent
    update_repo_cache: true

- name: Create AWS Load Balancer Controller service account
  kubernetes.core.k8s:
    name: aws-load-balancer-controller
    api_version: v1
    kind: ServiceAccount
    namespace: "{{ kube_system_namespace }}"
    definition:
      metadata:
        annotations:
          eks.amazonaws.com/role-arn: "{{ alb_controller_role_arn }}"
    state: present

- name: Deploy AWS Load Balancer Controller via Helm
  kubernetes.core.helm:
    name: aws-load-balancer-controller
    chart_ref: "{{ eks_repo_name }}/aws-load-balancer-controller"
    release_namespace: "{{ kube_system_namespace }}"
    values:
      clusterName: "{{ cluster_name }}"
      region: "{{ aws_region }}"
      vpcId: "{{ cluster_vpc_id }}"
      serviceAccount:
        create: false
        name: aws-load-balancer-controller
    state: present
    wait: true
    timeout: "10m0s"

- name: Wait for ALB controller deployment to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: aws-load-balancer-controller
    namespace: "{{ kube_system_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300

- name: Verify ALB controller pods are running
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ kube_system_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=aws-load-balancer-controller
  register: alb_pods

- name: Display ALB controller status
  debug:
    msg: "AWS Load Balancer Controller deployed successfully with {{ alb_pods.resources | length }} pods running"

- name: Verify ALB controller is ready
  fail:
    msg: "ALB controller pods are not running properly"
  when: alb_pods.resources | length == 0
