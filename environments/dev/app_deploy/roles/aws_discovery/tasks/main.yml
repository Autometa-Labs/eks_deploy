---
# =============================================
# AWS Resource Discovery Role
# Discovers AWS resources using cluster name from env.yml
# =============================================

- name: Load environment configuration
  include_vars: "{{ playbook_dir }}/env.yml"

- name: Display environment being discovered
  debug:
    msg: "Discovering AWS resources for {{ env_name }} environment (cluster: {{ cluster_name }})"

- name: Get EKS cluster information
  shell: |
    aws eks describe-cluster --name "{{ cluster_name }}" --region "{{ aws_region }}" --output json
  register: cluster_info_raw
  changed_when: false

- name: Parse cluster information
  set_fact:
    cluster_info: "{{ cluster_info_raw.stdout | from_json }}"

- name: Extract OIDC issuer URL from cluster
  set_fact:
    oidc_issuer_url: "{{ cluster_info.cluster.identity.oidc.issuer }}"
    cluster_vpc_id: "{{ cluster_info.cluster.resourcesVpcConfig.vpcId }}"
    cluster_subnet_ids: "{{ cluster_info.cluster.resourcesVpcConfig.subnetIds }}"
    cluster_security_group_ids: "{{ cluster_info.cluster.resourcesVpcConfig.securityGroupIds }}"
    cluster_endpoint: "{{ cluster_info.cluster.endpoint }}"
    cluster_version: "{{ cluster_info.cluster.version }}"

- name: Find OIDC identity provider ARN
  shell: |
    aws iam list-open-id-connect-providers --output json | jq -r '.OpenIDConnectProviderList[] | select(.Arn | contains("{{ oidc_issuer_url | regex_replace("https://") }}")) | .Arn'
  register: oidc_provider_arn_raw
  changed_when: false

- name: Set OIDC provider ARN
  set_fact:
    oidc_provider_arn: "{{ oidc_provider_arn_raw.stdout }}"

- name: Find ALB controller IAM role ARN
  shell: |
    aws iam get-role --role-name "{{ env_name }}-app-lb-controller-cl01" --output json | jq -r '.Role.Arn'
  register: alb_role_arn_raw
  changed_when: false

- name: Set ALB controller role ARN
  set_fact:
    alb_controller_role_arn: "{{ alb_role_arn_raw.stdout }}"

- name: Find EBS CSI driver IAM role ARN
  shell: |
    aws iam get-role --role-name "{{ env_name }}-app-ebs-csi-driver-cl01" --output json | jq -r '.Role.Arn'
  register: ebs_role_arn_raw
  changed_when: false

- name: Set EBS CSI driver role ARN
  set_fact:
    ebs_csi_driver_role_arn: "{{ ebs_role_arn_raw.stdout }}"

- name: Display discovered resources
  debug:
    msg:
      - "=== AWS Resources Discovered ==="
      - "Cluster Name: {{ cluster_name }}"
      - "Cluster Endpoint: {{ cluster_endpoint }}"
      - "Cluster Version: {{ cluster_version }}"
      - "VPC ID: {{ cluster_vpc_id }}"
      - "OIDC Issuer URL: {{ oidc_issuer_url }}"
      - "OIDC Provider ARN: {{ oidc_provider_arn }}"
      - "ALB Controller Role ARN: {{ alb_controller_role_arn }}"
      - "EBS CSI Driver Role ARN: {{ ebs_csi_driver_role_arn }}"

- name: Update kubeconfig for discovered cluster
  shell: |
    aws eks update-kubeconfig --name "{{ cluster_name }}" --region "{{ aws_region }}"
  changed_when: true

- name: Verify cluster connectivity
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
  register: cluster_nodes
  failed_when: cluster_nodes.resources | length == 0

- name: Display cluster node information
  debug:
    msg: "Successfully connected to cluster with {{ cluster_nodes.resources | length }} nodes"
