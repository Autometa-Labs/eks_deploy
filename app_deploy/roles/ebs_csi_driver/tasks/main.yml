---
# =============================================
# EBS CSI Driver Deployment Role
# Uses discovered AWS resources from aws_discovery role
# =============================================

- name: Install EBS CSI Driver as EKS add-on
  shell: |
    aws eks create-addon \
      --cluster-name "{{ cluster_name }}" \
      --addon-name aws-ebs-csi-driver \
      --service-account-role-arn "{{ ebs_csi_driver_role_arn }}" \
      --resolve-conflicts OVERWRITE \
      --region "{{ aws_region }}" || echo "Add-on may already exist, continuing..."
  register: addon_result
  changed_when: "'AlreadyExistsException' not in addon_result.stderr"

- name: Wait for EBS CSI Driver add-on to be active
  shell: |
    aws eks wait addon-active \
      --cluster-name "{{ cluster_name }}" \
      --addon-name aws-ebs-csi-driver \
      --region "{{ aws_region }}"
  register: addon_wait
  changed_when: false

- name: Ensure EBS CSI controller service account is properly annotated
  kubernetes.core.k8s:
    name: ebs-csi-controller-sa
    api_version: v1
    kind: ServiceAccount
    namespace: "{{ kube_system_namespace }}"
    definition:
      metadata:
        annotations:
          eks.amazonaws.com/role-arn: "{{ ebs_csi_driver_role_arn }}"
    state: present

- name: Create gp3 storage class
  kubernetes.core.k8s:
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: "{{ storage_class }}"
      provisioner: ebs.csi.aws.com
      parameters:
        type: gp3
        fsType: ext4
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
    state: present

- name: Restart EBS CSI controller to pick up new role
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    name: ebs-csi-controller
    namespace: "{{ kube_system_namespace }}"
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ ansible_date_time.iso8601 }}"
    state: present

- name: Wait for EBS CSI controller deployment to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: ebs-csi-controller
    namespace: "{{ kube_system_namespace }}"
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300

- name: Verify EBS CSI driver pods are running
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ kube_system_namespace }}"
    label_selectors:
      - app=ebs-csi-controller
  register: ebs_pods

- name: Verify storage class was created
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ storage_class }}"
  register: storage_class_info

- name: Display EBS CSI driver status
  debug:
    msg:
      - "EBS CSI Driver deployed successfully"
      - "Controller pods running: {{ ebs_pods.resources | length }}"
      - "Storage class '{{ storage_class }}' created: {{ storage_class_info.resources | length > 0 }}"

- name: Verify EBS CSI driver is ready
  fail:
    msg: "EBS CSI driver is not properly configured"
  when: ebs_pods.resources | length == 0 or storage_class_info.resources | length == 0
