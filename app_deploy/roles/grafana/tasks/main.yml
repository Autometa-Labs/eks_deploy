---
# =============================================
# Grafana Deployment Role
# Uses discovered AWS resources from aws_discovery role
# =============================================

- name: Create monitoring namespace
  kubernetes.core.k8s:
    name: "{{ monitoring_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Add Grafana Helm repository
  kubernetes.core.helm_repository:
    name: "{{ grafana_repo_name }}"
    repo_url: "{{ grafana_repo_url }}"

- name: Update Helm repositories
  kubernetes.core.helm:
    name: dummy
    chart_ref: dummy
    release_namespace: dummy
    state: absent
    update_repo_cache: true

- name: Deploy Grafana via Helm
  kubernetes.core.helm:
    name: grafana
    chart_ref: "{{ grafana_repo_name }}/grafana"
    release_namespace: "{{ monitoring_namespace }}"
    values:
      persistence:
        enabled: true
        size: "{{ grafana_storage_size }}"
        storageClassName: "{{ storage_class }}"
      service:
        type: ClusterIP
        port: 80
        targetPort: 3000
      adminPassword: "{{ grafana_admin_password }}"
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
              access: proxy
              isDefault: true
            - name: Loki
              type: loki
              url: http://loki.monitoring.svc.cluster.local:3100
              access: proxy
              jsonData:
                maxLines: 1000
    state: present
    wait: true
    timeout: "10m0s"

- name: Create Grafana ingress for ALB
  kubernetes.core.k8s:
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: grafana-ingress
        namespace: "{{ monitoring_namespace }}"
        annotations:
          kubernetes.io/ingress.class: alb
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
          alb.ingress.kubernetes.io/healthcheck-path: /api/health
          alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
          alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
          alb.ingress.kubernetes.io/healthy-threshold-count: '2'
          alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
      spec:
        rules:
          - http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: grafana
                      port:
                        number: 80
    state: present

- name: Wait for Grafana deployment to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: grafana
    namespace: "{{ monitoring_namespace }}"
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300

- name: Verify Grafana pods are running
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ monitoring_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=grafana
  register: grafana_pods

- name: Wait for ALB to be provisioned (may take a few minutes)
  kubernetes.core.k8s_info:
    api_version: networking.k8s.io/v1
    kind: Ingress
    name: grafana-ingress
    namespace: "{{ monitoring_namespace }}"
  register: grafana_ingress
  until: grafana_ingress.resources[0].status.loadBalancer.ingress is defined
  retries: 20
  delay: 30

- name: Get ALB URL
  set_fact:
    grafana_alb_url: "{{ grafana_ingress.resources[0].status.loadBalancer.ingress[0].hostname }}"
  when: grafana_ingress.resources[0].status.loadBalancer.ingress is defined

- name: Create Grafana CNAME record in Route53
  amazon.aws.route53:
    state: present
    zone: "{{ dns_domain }}"
    record: "{{ grafana_dns_name }}"
    type: CNAME
    value: "{{ grafana_alb_url }}"
    ttl: 300
    wait: true
    wait_timeout: 300
  when: grafana_alb_url is defined
  tags: ['grafana']

- name: Display Grafana deployment status
  debug:
    msg:
      - "Grafana deployed successfully!"
      - "Pods running: {{ grafana_pods.resources | length }}"
      - "ALB URL: http://{{ grafana_alb_url | default('ALB still provisioning...') }}"
      - "DNS URL: http://{{ grafana_dns_name | default('DNS not configured') }}"
      - "Default login: admin / {{ grafana_admin_password }}"

- name: Verify Grafana is ready
  fail:
    msg: "Grafana pods are not running properly"
  when: grafana_pods.resources | length == 0
